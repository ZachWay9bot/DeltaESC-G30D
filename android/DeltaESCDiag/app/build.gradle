plugins {
    id 'com.android.application'
}

def srcZip = rootProject.file('deltaesc-g30xbot-v010-source.zip')
def srcDir = file("$buildDir/g30xbot-source")
if (!srcZip.exists()) throw new GradleException("source ZIP missing: " + srcZip)
project.delete(srcDir)
srcDir.mkdirs()
project.copy {
    from zipTree(srcZip)
    into srcDir
}

android {
    namespace 'de.deltaesc.g30xbot.rc1'
    compileSdk 35
    defaultConfig {
        applicationId "de.deltaesc.g30xbot.rc1"
        minSdk 26
        targetSdk 35
        versionCode 10
        versionName "0.10.0-rc1"
    }
    sourceSets {
        main {
            manifest.srcFile new File(srcDir, 'AndroidManifest.xml')
            java.srcDirs = [new File(srcDir, 'src')]
            res.srcDirs = [new File(srcDir, 'res')]
        }
        test { java.srcDirs = [] }
    }
    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
