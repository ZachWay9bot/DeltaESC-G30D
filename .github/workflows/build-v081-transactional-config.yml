name: Audit DeltaESC v0.8.1 BLE transactional config (SOURCE ONLY)
on:
  push:
    branches: ["dev/v0.8.1-ble-transactional-config-sourceonly"]
    paths:
      - "v0.8.1/**"
      - ".github/workflows/build-v081-transactional-config.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned LLVM and emulator
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18 xz-utils patch
          python3 -m pip install unicorn==2.1.4
      - name: Reconstruct canonical v0.6.7 firmware
        run: |
          set -euxo pipefail
          mkdir -p /tmp/v061 /tmp/v081
          tar -xJf v0.6/DeltaESC_G30D_v0_6_source.tar.xz -C /tmp/v061
          xz -dc v0.6.1/v0611.patch.xz | patch -d /tmp/v061 -p1
          cp -a /tmp/v061/. /tmp/v081/
          xz -dc v0.6.2/v062.patch.xz | patch -d /tmp/v081 -p4
          xz -dc v0.6.3/v063.patch.xz | patch -d /tmp/v081 -p4
          xz -dc v0.6.4/v064.patch.xz | patch -d /tmp/v081 -p4
          xz -dc v0.6.5/v065.patch.xz | patch -d /tmp/v081 -p1
          cat v0.6.6/v066.patch.part-* > /tmp/v066.patch
          echo "dfab72dc0bf7869d595e041cb1a797a4ac5f50e2118c5011f99a5d7fc33abd0a  /tmp/v066.patch" | sha256sum -c -
          patch -d /tmp/v081 -p1 < /tmp/v066.patch
          cat v0.6.7/v067.patch.part-* > /tmp/v067.patch
          echo "430666ee2c9967973c5aaec1560385010ab531cc04d5e790ec28cf495a6c18a4  /tmp/v067.patch" | sha256sum -c -
          patch -d /tmp/v081 -p1 < /tmp/v067.patch
          echo "842f432fdc32010108bd72adebb0d892436ce0a19ddf92fce4c293356128febe  /tmp/v081/src/iap_update.c" | sha256sum -c -
      - name: Apply update, power, retry and passive-motor safety overlays
        run: |
          set -euxo pipefail
          cp v0.6.8/src/iap_control.[ch] /tmp/v081/src/
          patch -d /tmp/v081 -p1 < v0.6.8/iap_powercut_core.patch
          python3 v0.6.9/apply_v069.py /tmp/v081
          patch -d /tmp/v081 -p1 < v0.6.10/iap_retry.patch
          python3 v0.7.0/apply_v070.py /tmp/v081
          python3 v0.7.1/apply_v071.py /tmp/v081
          python3 v0.7.2/apply_v072.py /tmp/v081
          test -z "$(find /tmp/v081 -name '*.rej' -print -quit)"
      - name: Import pinned v0.8.0 parameterized sensorless core
        run: |
          set -euxo pipefail
          echo "4c76c78595117f8b1ec6f7804f335fd091254fc1febb73281f7e13ef8e611e7c  v0.8.0/motor_core_v070_overlay.tar.xz" | sha256sum -c -
          python3 v0.8.0/apply_v080.py /tmp/v081 v0.8.0/motor_core_v070_overlay.tar.xz
          mkdir -p /tmp/v081_vendor
          tar -xJf v0.8.0/motor_core_v070_overlay.tar.xz -C /tmp/v081_vendor
          cp /tmp/v081_vendor/tools/motor_core_host_test.c /tmp/v081/tools/
          cp v0.7.2/tools/test_ble_motor_probe.c /tmp/v081/tools/
      - name: Apply v0.8.1 transactional BLE configuration
        run: python3 v0.8.1/apply_v081.py /tmp/v081
      - name: Negative build rejects any physical gate arming
        working-directory: /tmp/v081
        run: |
          set -euo pipefail
          if clang-18 --target=arm-none-eabi -mcpu=cortex-m3 -mthumb -ffreestanding -Isrc -DPOWER_STAGE_ARM_ALLOWED=1 -DSENSORLESS_RUN_ALLOWED=0 -fsyntax-only src/main.c > /tmp/armed.log 2>&1; then
            echo "FAIL: dangerous armed compilation succeeded"; exit 1
          fi
          grep -F 'must NEVER arm a physical power stage' /tmp/armed.log
      - name: Build gate-OFF SYNC-SAFE only
        working-directory: /tmp/v081
        run: make clean safe CC=clang-18 OBJCOPY=llvm-objcopy-18 OBJDUMP=llvm-objdump-18
      - name: Transaction and sensorless host regressions
        env:
          HOST_CC: clang-18
        run: |
          python3 /tmp/v081/tools/preflight_v081.py
          python3 /tmp/v081/tools/test_motor_config_txn.py
          python3 v0.8.1/tools/test_motor_integration_v081.py /tmp/v081
      - name: Emulate complete ARM UART/IAP path with retry guard
        env:
          ARM_NM: llvm-nm-18
        run: |
          cp /tmp/v081/build/DeltaESC_G30D_v0_8_1_ble_syncsafe.elf /tmp/v081/build/target_syncsafe.elf
          cp /tmp/v081/build/DeltaESC_G30D_v0_8_1_ble_syncsafe.bin /tmp/v081/build/target_syncsafe.bin
          python3 v0.6.10/full_target_protocol.py /tmp/v081 --retry --guard --blocks 130
      - name: Emulate v0.8.1 F0-F5 transaction over actual ARM Ninebot parser
        env:
          ARM_NM: llvm-nm-18
        run: python3 v0.8.1/tools/test_arm_v081.py /tmp/v081
      - name: Power-loss and stock bootloader error-path regressions
        env:
          HOST_CC: clang-18
        run: |
          cp v0.6.8/tools/{iap_control_powercut_test.c,test_iap_powercut.py} /tmp/v081/tools/
          python3 /tmp/v081/tools/test_iap_powercut.py
          python3 v0.6.8/tools/test_stock_copy_faults.py
          python3 v0.6.8/tools/test_stock_error_paths.py
      - name: Existing transport, crypto and dashboard regressions
        working-directory: /tmp/v081
        env:
          HOST_CC: clang-18
        run: |
          python3 tools/test_iap_ack.py
          python3 tools/test_iap_transport.py
          python3 tools/test_iap_crypto.py
          python3 tools/test_dashboard_runtime.py
      - name: Export source only
        run: |
          tar --exclude=build --exclude=shu --exclude='__pycache__' -C /tmp/v081 -cJf /tmp/DeltaESC_v081_BLE_TRANSACTIONAL_CONFIG_SOURCE_ONLY.tar.xz .
          sha256sum /tmp/DeltaESC_v081_BLE_TRANSACTIONAL_CONFIG_SOURCE_ONLY.tar.xz
      - uses: actions/upload-artifact@v4
        with:
          name: DeltaESC-v0.8.1-BLE-TRANSACTIONAL-CONFIG-SOURCE-ONLY
          if-no-files-found: error
          retention-days: 30
          path: /tmp/DeltaESC_v081_BLE_TRANSACTIONAL_CONFIG_SOURCE_ONLY.tar.xz
