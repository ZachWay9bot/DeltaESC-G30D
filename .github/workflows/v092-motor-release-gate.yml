name: DeltaESC v0.9.2 MT8006A motor-release veto
on:
  push:
    branches: [dev/v0.9.2-mt8006a-release-guard]
    paths:
      - 'v0.9.2/**'
      - '.github/workflows/v092-motor-release-gate.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  release-eligibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Extract pinned v0.9.0 source (unchanged)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p base source
          gh run download 37996878172 --repo "${{ github.repository }}" --name DeltaESC-v0.9.0-FIRSTSPIN-STOP-SAFETY-GATEOFF-SOURCE-ONLY --dir base
          echo "b66dc23226b18d8936c4d526f3a78d69e6b8c927e40ecc4c2dc84277ceee89d4  base/DeltaESC_v090_FIRSTSPIN_STOP_SAFETY_GATEOFF_SOURCE_ONLY.tar.xz" | sha256sum -c -
          tar -xJf base/DeltaESC_v090_FIRSTSPIN_STOP_SAFETY_GATEOFF_SOURCE_ONLY.tar.xz -C source
          patch -d source -p1 < v0.9.1/v091_pinmap_safety.patch
      - name: Non-motor diagnostic is permitted
        run: python3 v0.9.2/motor_release_gate.py --source source/src/main.c --purpose diagnostic
      - name: Motor release MUST be rejected (expected failure)
        run: |
          set +e
          python3 v0.9.2/motor_release_gate.py --source source/src/main.c --purpose motor > motor_gate_result.txt 2>&1
          result=$?
          set -e
          cat motor_gate_result.txt
          test "$result" -eq 2
      - name: Final status
        run: echo "Source-only release gate passes by proving motor output remains BLOCKED."
