name: Build v0.7.4 observer handover
on:
  push:
    branches: [ "dev/v0.7.4-observer-handover" ]
    paths: [ "v0.7.4/**", ".github/workflows/build-v074-observer.yml" ]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18 xz-utils patch
      - name: Reconstruct v0.7.3
        run: |
          set -euxo pipefail
          mkdir -p /tmp/v061 /tmp/v074
          tar -xJf v0.6/DeltaESC_G30D_v0_6_source.tar.xz -C /tmp/v061
          xz -dc v0.6.1/v0611.patch.xz | patch -d /tmp/v061 -p1
          cp -a /tmp/v061/. /tmp/v074/
          xz -dc v0.6.2/v062.patch.xz | patch -d /tmp/v074 -p4
          xz -dc v0.6.3/v063.patch.xz | patch -d /tmp/v074 -p4
          xz -dc v0.6.4/v064.patch.xz | patch -d /tmp/v074 -p4
          xz -dc v0.6.5/v065.patch.xz | patch -d /tmp/v074 -p1
          cp v0.7.0/apply_v070.py /tmp/v074/apply_v070.py && python3 /tmp/v074/apply_v070.py
          cp v0.7.2/apply_v072.py /tmp/v074/apply_v072.py && python3 /tmp/v074/apply_v072.py
          cp v0.7.3/apply_v073.py /tmp/v074/apply_v073.py && python3 /tmp/v074/apply_v073.py
          cp v0.7.4/apply_v074.py /tmp/v074/apply_v074.py && python3 /tmp/v074/apply_v074.py
      - name: Safety and observer preflight
        working-directory: /tmp/v074
        run: |
          python3 - <<'PY'
          from pathlib import Path
          m=Path('src/main.c').read_text()
          c=Path('src/sensorless_control.c').read_text()
          h=Path('src/sensorless_control.h').read_text()
          assert '#define FW_BUILD 0x0740u' in m
          assert 'current_ma > 500u' in c
          assert 'GPIOB_BASE,12' in m and 'TIM_BDTR_BKE' in m
          assert 'g_adc_offset[0]-(int32_t)s0' in m
          assert 'int32_t observer_speed_ehz_q8;' in h
          assert 'int32_t observer_speed_filt_ehz_q8;' in h
          assert 'speed >= MIN_HANDOVER_EHZ_Q8' in c
          assert 'disagreement <= MAX_SPEED_DISAGREE_EHZ_Q8' in c
          assert 'abs_speed' not in c
          print('v0.7.4 safety/observer preflight PASS')
          PY
      - name: Build matrix
        working-directory: /tmp/v074
        run: make clean all CC=clang-18 OBJCOPY=llvm-objcopy-18 OBJDUMP=llvm-objdump-18
      - name: Motor core regression
        working-directory: /tmp/v074
        run: |
          clang-18 -std=c11 -Wall -Wextra -Werror -Isrc tools/motor_core_host_test.c src/sensorless_control.c -o build/motor_core_host_test
          ./build/motor_core_host_test
      - name: Q15 regression
        working-directory: /tmp/v074
        run: |
          clang-18 -std=c11 -Wall -Wextra -Werror -fsanitize=undefined -Isrc tools/pi_q15_bench_test.c src/sensorless_control.c -o build/pi_q15_bench_test
          ./build/pi_q15_bench_test
      - name: Observer speed regression
        working-directory: /tmp/v074
        run: |
          clang-18 -std=c11 -Wall -Wextra -Werror -fsanitize=undefined -Isrc tools/observer_speed_host_test.c src/sensorless_control.c -o build/observer_speed_host_test
          ./build/observer_speed_host_test
      - name: Hash artifacts
        working-directory: /tmp/v074
        run: |
          test $(stat -c%s build/DeltaESC_G30D_v0_7_4_ble_sensorless_bench.bin) -le 53248
          sha256sum build/*.bin | tee build/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: DeltaESC-G30D-v0.7.4-OBSERVER-HANDOVER
          retention-days: 30
          path: |
            /tmp/v074/build/DeltaESC_G30D_v0_7_4_ble_sensorless_bench.bin
            /tmp/v074/build/DeltaESC_G30D_v0_7_4_ble_observer_zero_vector.bin
            /tmp/v074/build/DeltaESC_G30D_v0_7_4_ble_syncsafe.bin
            /tmp/v074/build/SHA256SUMS.txt
