name: DeltaESC VESC-EBiCS STM32F103 observer port
on:
  push:
    branches: [dev/vesc-ebics-f103-observer-g30d]
    paths:
      - 'v0.9.6/**'
      - '.github/workflows/v096-vesc-ebics-f103.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  cortex-m3-vesc-ebics:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM LLVM toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y clang-18 llvm-18 gcc
      - name: Download immutable previous baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p base source
          gh run download 37996878172 --repo "${{ github.repository }}" --name DeltaESC-v0.9.0-FIRSTSPIN-STOP-SAFETY-GATEOFF-SOURCE-ONLY --dir base
          echo 'b66dc23226b18d8936c4d526f3a78d69e6b8c927e40ecc4c2dc84277ceee89d4  base/DeltaESC_v090_FIRSTSPIN_STOP_SAFETY_GATEOFF_SOURCE_ONLY.tar.xz' | sha256sum -c -
          tar -xJf base/DeltaESC_v090_FIRSTSPIN_STOP_SAFETY_GATEOFF_SOURCE_ONLY.tar.xz -C source
      - name: Reconstruct exact v0.9.5 hardware backend then VESC-EBiCS port
        run: |
          set -euo pipefail
          apply() {
            python3 -c 'import pathlib,sys; x=pathlib.Path(sys.argv[1]).read_bytes(); sys.stdout.buffer.write(x if x.endswith(b"\n") else x+b"\n")' "$1" | patch --batch --forward -s -d source -p1
          }
          apply v0.9.1/v091_pinmap_safety.patch
          cp v0.9.1/tools/pinmap_power_regression_test.py source/tools/
          cp v0.9.1/tools/run_v091_tests.sh source/tools/
          apply v0.9.2/v092_foc_adc_contract.patch
          apply v0.9.3/v093_motor_id.patch
          apply v0.9.4/v094_motor_pipeline.patch
          apply v0.9.5/v095_drv126_gate.patch
          echo 'cc9006646252a242cd73f86e7e4983b5a6b94edb4aef9a81bc21b40065010799  -' > /tmp/v096_expected
          python3 -c 'import pathlib; x=pathlib.Path("v0.9.6/v096_vesc_ebics_port.patch").read_bytes(); import sys;sys.stdout.buffer.write(x if x.endswith(b"\n") else x+b"\n")' | sha256sum -c /tmp/v096_expected
          apply v0.9.6/v096_vesc_ebics_port.patch
      - name: Compile Cortex-M3 image and run complete tests
        run: |
          set -euo pipefail
          (cd source && make clean && ARM_CC=clang-18 ARM_OBJCOPY=llvm-objcopy-18 ARM_OBJDUMP=llvm-objdump-18 bash tools/run_v096_tests.sh)
          test "$(stat -c %s source/build/DeltaESC_G30D_v0_9_6_ble_syncsafe.bin)" -lt 53248
          grep -Fq '#define FW_BUILD 0x0906u' source/src/main.c
          grep -Fq '#define VESC_EBICS_OBSERVER 1' source/src/sensorless_control.c
          grep -Fq '#define COMM_CURRENT_SCALE_HW_VALID 0u' source/src/main.c
          grep -Fq '#define COMM_ADC_TIMING_HW_VALID 0u' source/src/main.c
          echo 'Source-only VESC-Ortega/EBiCS port. Not hardware motor-qualified.'
