name: Build DeltaESC G30D v0.6.3 SAFE-ID
on:
  push:
    branches: [ "dev/v0.6.3-safe-id" ]
    paths: [ "v0.6.3/**", ".github/workflows/build-v063-safe-id.yml" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18 xz-utils patch
      - name: Reconstruct v0.6.3 source
        run: |
          mkdir -p /tmp/v061 /tmp/v062 /tmp/v063
          tar -xJf v0.6/DeltaESC_G30D_v0_6_source.tar.xz -C /tmp/v061
          xz -dc v0.6.1/v0611.patch.xz | patch -d /tmp/v061 -p1
          cp -a /tmp/v061/. /tmp/v062/
          xz -dc v0.6.2/v062.patch.xz | patch -d /tmp/v062 -p4
          cp -a /tmp/v062/. /tmp/v063/
          xz -dc v0.6.3/v063.patch.xz | patch -d /tmp/v063 -p1
      - name: Build matrix
        working-directory: /tmp/v063
        run: make clean all CC=clang-18 OBJCOPY=llvm-objcopy-18 OBJDUMP=llvm-objdump-18
      - name: SAFE-ID staged-IAP preflight
        working-directory: /tmp/v063
        run: python3 tools/preflight_v063.py
      - name: IAP crypto regression
        working-directory: /tmp/v063
        run: python3 tools/test_iap_crypto.py
      - name: SHU ZIPv3 preflight
        working-directory: /tmp/v063
        run: python3 tools/test_shu_package.py
      - name: Build packages
        working-directory: /tmp/v063
        run: |
          mkdir -p shu
          python3 tools/make_shu_zip.py build/DeltaESC_G30D_v0_6_3_ble_syncsafe.bin shu/DeltaESC_G30D_v0_6_3_SHU_SYNC_SAFE.zip --name "DeltaESC G30D v0.6.3 SAFE-ID" --variant syncsafe
          python3 tools/make_shu_zip.py build/DeltaESC_G30D_v0_6_3_ble_observer_zero_vector.bin shu/DeltaESC_G30D_v0_6_3_SHU_ZERO_VECTOR.zip --name "DeltaESC G30D v0.6.3 ZERO VECTOR" --variant zero-vector
          python3 tools/make_shu_zip.py build/DeltaESC_G30D_v0_6_3_ble_sensorless_bench.bin shu/DeltaESC_G30D_v0_6_3_SHU_SENSORLESS_BENCH.zip --name "DeltaESC G30D v0.6.3 SENSORLESS BENCH" --variant sensorless-bench
          tar --exclude=build --exclude=shu -C /tmp/v063 -cJf /tmp/DeltaESC_G30D_v0_6_3_source.tar.xz .
          sha256sum build/*.bin shu/*.zip /tmp/DeltaESC_G30D_v0_6_3_source.tar.xz
      - uses: actions/upload-artifact@v4
        with:
          name: DeltaESC-G30D-v0.6.3-SAFE-ID
          retention-days: 30
          if-no-files-found: error
          path: |
            /tmp/v063/build/*.bin
            /tmp/v063/shu/*.zip
            /tmp/DeltaESC_G30D_v0_6_3_source.tar.xz
            /tmp/v063/README.md
