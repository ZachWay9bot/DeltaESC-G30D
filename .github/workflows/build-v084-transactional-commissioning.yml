name: Audit DeltaESC v0.8.4 transactional motor config and dual-ADC plan (SOURCE ONLY)
on:
  push:
    branches: ["dev/v0.8.4-guarded-transactional-motor-config"]
    paths:
      - "v0.8.4/**"
      - ".github/workflows/build-v084-transactional-commissioning.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned LLVM and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18 xz-utils patch
          python3 -m pip install unicorn==2.1.4
      - name: Reconstruct canonical v0.6.7 firmware
        run: |
          set -euxo pipefail
          mkdir -p /tmp/v061 /tmp/v084
          tar -xJf v0.6/DeltaESC_G30D_v0_6_source.tar.xz -C /tmp/v061
          xz -dc v0.6.1/v0611.patch.xz | patch -d /tmp/v061 -p1
          cp -a /tmp/v061/. /tmp/v084/
          xz -dc v0.6.2/v062.patch.xz | patch -d /tmp/v084 -p4
          xz -dc v0.6.3/v063.patch.xz | patch -d /tmp/v084 -p4
          xz -dc v0.6.4/v064.patch.xz | patch -d /tmp/v084 -p4
          xz -dc v0.6.5/v065.patch.xz | patch -d /tmp/v084 -p1
          cat v0.6.6/v066.patch.part-* > /tmp/v066.patch
          echo "dfab72dc0bf7869d595e041cb1a797a4ac5f50e2118c5011f99a5d7fc33abd0a  /tmp/v066.patch" | sha256sum -c -
          patch -d /tmp/v084 -p1 < /tmp/v066.patch
          cat v0.6.7/v067.patch.part-* > /tmp/v067.patch
          echo "430666ee2c9967973c5aaec1560385010ab531cc04d5e790ec28cf495a6c18a4  /tmp/v067.patch" | sha256sum -c -
          patch -d /tmp/v084 -p1 < /tmp/v067.patch
      - name: Apply v0.6.8-v0.6.10 update and power safety
        run: |
          set -euxo pipefail
          cp v0.6.8/src/iap_control.[ch] /tmp/v084/src/
          patch -d /tmp/v084 -p1 < v0.6.8/iap_powercut_core.patch
          python3 v0.6.9/apply_v069.py /tmp/v084
          patch -d /tmp/v084 -p1 < v0.6.10/iap_retry.patch
          test -z "$(find /tmp/v084 -name '*.rej' -print -quit)"
      - name: Reconstruct v0.7.0-v0.7.2 passive motor and DashBLE layers
        run: |
          set -euxo pipefail
          python3 v0.7.0/apply_v070.py /tmp/v084
          python3 v0.7.1/apply_v071.py /tmp/v084
          python3 v0.7.2/apply_v072.py /tmp/v084
      - name: Import v0.8.0 parameterized sensorless motor core
        run: |
          set -euxo pipefail
          echo "4c76c78595117f8b1ec6f7804f335fd091254fc1febb73281f7e13ef8e611e7c  v0.8.0/motor_core_v070_overlay.tar.xz" | sha256sum -c -
          python3 v0.8.0/apply_v080.py /tmp/v084 v0.8.0/motor_core_v070_overlay.tar.xz
          mkdir -p /tmp/v080_vendor
          tar -xJf v0.8.0/motor_core_v070_overlay.tar.xz -C /tmp/v080_vendor
          cp /tmp/v080_vendor/tools/motor_core_host_test.c /tmp/v084/tools/
          cp v0.7.2/tools/test_ble_motor_probe.c /tmp/v084/tools/
      - name: Apply v0.8.1 phone commissioning guard
        run: python3 v0.8.1/apply_v081.py /tmp/v084
      - name: Apply v0.8.2 stock current frontend model
        run: python3 v0.8.2/apply_v082.py /tmp/v084
      - name: Apply v0.8.3 stock dual-ADC acquisition plan
        run: python3 v0.8.3/apply_v083.py /tmp/v084
      - name: Merge magic-gated atomic F0-F5 parameter staging into commissioning firmware
        run: |
          python3 v0.8.4/apply_v084.py /tmp/v084
          cp v0.8.4/tools/motor_config_txn_test.c /tmp/v084/tools/
      - name: Negative build rejects any gate arming
        working-directory: /tmp/v084
        run: |
          set -euo pipefail
          if clang-18 --target=arm-none-eabi -mcpu=cortex-m3 -mthumb -ffreestanding -Isrc -DPOWER_STAGE_ARM_ALLOWED=1 -DSENSORLESS_RUN_ALLOWED=0 -fsyntax-only src/main.c > /tmp/armed.log 2>&1; then
            echo "FAIL: dangerous armed compilation succeeded"; exit 1
          fi
          grep -F 'must NEVER arm a physical power stage' /tmp/armed.log
      - name: Build gate-OFF SYNC-SAFE target only
        working-directory: /tmp/v084
        run: make clean safe CC=clang-18 OBJCOPY=llvm-objcopy-18 OBJDUMP=llvm-objdump-18
      - name: Test stock DRV126 current frontend and dual-ADC plan
        env:
          HOST_CC: clang-18
        run: |
          python3 v0.8.2/tools/test_stock_current_frontend.py /tmp/v084
          python3 v0.8.3/tools/test_stock_dual_adc_plan.py /tmp/v084
      - name: Test commissioning guard truth table
        env:
          HOST_CC: clang-18
        run: python3 v0.8.1/tools/test_commissioning_guard.py /tmp/v084
      - name: Test sensorless integration and passive BLE pages
        env:
          HOST_CC: clang-18
        run: python3 v0.8.4/tools/test_motor_integration.py /tmp/v084
      - name: Test F0-F5 staged parameter transaction under UBSan
        working-directory: /tmp/v084
        run: |
          clang-18 -std=c11 -O1 -Wall -Wextra -Werror -fsanitize=undefined -fno-sanitize-recover=all \
            -Isrc tools/motor_config_txn_test.c src/motor_config_txn.c -o build/transaction_host
          build/transaction_host
      - name: Emulate full SYNC-SAFE UART/IAP target with ACK retries
        env:
          ARM_NM: llvm-nm-18
        run: |
          cp /tmp/v084/build/DeltaESC_G30D_v0_8_4_ble_syncsafe.elf /tmp/v084/build/target_syncsafe.elf
          cp /tmp/v084/build/DeltaESC_G30D_v0_8_4_ble_syncsafe.bin /tmp/v084/build/target_syncsafe.bin
          python3 v0.6.10/full_target_protocol.py /tmp/v084 --retry --guard --blocks 130
      - name: Test actual ARM DashBLE commissioning ABI
        env:
          ARM_NM: llvm-nm-18
        run: python3 v0.8.4/tools/test_arm_v084.py /tmp/v084
      - name: Test staged-IAP and stock bootloader error branches
        env:
          HOST_CC: clang-18
        run: |
          cp v0.6.8/tools/{iap_control_powercut_test.c,test_iap_powercut.py} /tmp/v084/tools/
          python3 /tmp/v084/tools/test_iap_powercut.py
          python3 v0.6.8/tools/test_stock_copy_faults.py
          python3 v0.6.8/tools/test_stock_error_paths.py
      - name: Run existing transport and dashboard regressions
        working-directory: /tmp/v084
        env:
          HOST_CC: clang-18
        run: |
          python3 tools/test_iap_ack.py
          python3 tools/test_iap_transport.py
          python3 tools/test_iap_crypto.py
          python3 tools/test_dashboard_runtime.py
      - name: Export SOURCE-ONLY audit, excluding all firmware images
        run: |
          tar --exclude=build --exclude=shu --exclude='__pycache__' -C /tmp/v084 -cJf /tmp/DeltaESC_v084_TRANSACTIONAL_DASHBLE_SOURCE_ONLY.tar.xz .
          sha256sum /tmp/DeltaESC_v084_TRANSACTIONAL_DASHBLE_SOURCE_ONLY.tar.xz
      - uses: actions/upload-artifact@v4
        with:
          name: DeltaESC-v0.8.4-TRANSACTIONAL-DASHBLE-SOURCE-ONLY
          if-no-files-found: error
          retention-days: 30
          path: /tmp/DeltaESC_v084_TRANSACTIONAL_DASHBLE_SOURCE_ONLY.tar.xz
