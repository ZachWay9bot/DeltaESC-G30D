name: DeltaESC clean drive baseline build
on:
  push:
    branches: [dev/g30-fahrbetrieb-clean-20261023]
    paths:
      - .github/workflows/g30-clean-drive-baseline.yml
      - NEUSTART_FAHRTBETRIEB.md
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-baseline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM cross-build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-18 llvm-18 unzip
      - name: Load immutable v0.10.2 complete source archive
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin main
          git show FETCH_HEAD:downloads/DeltaESC_G30D_v0_10_2_COMPLETE_SOURCE.zip > /tmp/deltaesc-v102-source.zip
          echo "3a7a4533c743df97f555a199ef603ff52efb34af752301a43ffb0497a3285f6f  /tmp/deltaesc-v102-source.zip" | sha256sum -c -
          mkdir -p active-source
          unzip -q /tmp/deltaesc-v102-source.zip -d active-source
          test -s active-source/Makefile
          test -s active-source/src/main.c
          grep -Fq '#define FW_BUILD 0x1020u' active-source/src/main.c
      - name: Rebuild original motor candidate without changing IAP
        run: |
          set -euo pipefail
          make -C active-source clean
          make -C active-source rolling-active-rc CC=clang-18 OBJCOPY=llvm-objcopy-18 OBJDUMP=llvm-objdump-18
          test -s active-source/build/DeltaESC_G30D_v0_10_1_rolling_active_rc.bin
          echo "2b6e26b656a25bdab2b2e98eca447452b66628208cecf956e0df01134cf9eb75  active-source/build/DeltaESC_G30D_v0_10_1_rolling_active_rc.bin" | sha256sum -c -
      - name: Report
        run: |
          echo "Original DeltaESC G30D v0.10.2 source archive verified and rebuilt byte-identically." >> "$GITHUB_STEP_SUMMARY"
          echo "No firmware flash or hardware operation is performed." >> "$GITHUB_STEP_SUMMARY"
