name: Audit DeltaESC v0.8.0 Sensorless BEMF + DashBLE integration (SOURCE ONLY)
on:
  push:
    branches: ["dev/v0.8.0-sensorless-dashble-integration-sourceonly"]
    paths:
      - "v0.8.0/**"
      - ".github/workflows/build-v080-sensorless-integrated.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned LLVM and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18 xz-utils patch
          python3 -m pip install unicorn==2.1.4
      - name: Reconstruct canonical v0.6.7 firmware
        run: |
          set -euxo pipefail
          mkdir -p /tmp/v061 /tmp/v080
          tar -xJf v0.6/DeltaESC_G30D_v0_6_source.tar.xz -C /tmp/v061
          xz -dc v0.6.1/v0611.patch.xz | patch -d /tmp/v061 -p1
          cp -a /tmp/v061/. /tmp/v080/
          xz -dc v0.6.2/v062.patch.xz | patch -d /tmp/v080 -p4
          xz -dc v0.6.3/v063.patch.xz | patch -d /tmp/v080 -p4
          xz -dc v0.6.4/v064.patch.xz | patch -d /tmp/v080 -p4
          xz -dc v0.6.5/v065.patch.xz | patch -d /tmp/v080 -p1
          cat v0.6.6/v066.patch.part-* > /tmp/v066.patch
          echo "dfab72dc0bf7869d595e041cb1a797a4ac5f50e2118c5011f99a5d7fc33abd0a  /tmp/v066.patch" | sha256sum -c -
          patch -d /tmp/v080 -p1 < /tmp/v066.patch
          cat v0.6.7/v067.patch.part-* > /tmp/v067.patch
          echo "430666ee2c9967973c5aaec1560385010ab531cc04d5e790ec28cf495a6c18a4  /tmp/v067.patch" | sha256sum -c -
          patch -d /tmp/v080 -p1 < /tmp/v067.patch
          echo "842f432fdc32010108bd72adebb0d892436ce0a19ddf92fce4c293356128febe  /tmp/v080/src/iap_update.c" | sha256sum -c -
      - name: Apply v0.6.8 staged-IAP safety overlay
        run: |
          set -euxo pipefail
          cp v0.6.8/src/iap_control.[ch] /tmp/v080/src/
          patch -d /tmp/v080 -p1 < v0.6.8/iap_powercut_core.patch
          test -z "$(find /tmp/v080 -name '*.rej' -print -quit)"
      - name: Apply v0.6.9 power-button and shutdown integration
        run: |
          set -euxo pipefail
          python3 v0.6.9/apply_v069.py /tmp/v080
      - name: Apply ACK-loss retry patch (no other IAP behavioral changes)
        run: |
          set -euxo pipefail
          patch -d /tmp/v080 -p1 < v0.6.10/iap_retry.patch
          test -z "$(find /tmp/v080 -name '*.rej' -print -quit)"
      - name: Install passive motor ADC probe and hard-off build policy
        run: |
          set -euxo pipefail
          python3 v0.7.0/apply_v070.py /tmp/v080
      - name: Reproduce v0.7.0 integrator deadzone before applying fix
        run: |
          set -euo pipefail
          cc -std=c11 -O1 -Wall -Wextra -Werror -Wno-misleading-indentation -I/tmp/v080/src \
            /tmp/v080/src/sensorless_control.c \
            v0.7.1/tools/sensorless_pi_host_test.c -o /tmp/old_sensorless_pi_test
          set +e
          /tmp/old_sensorless_pi_test
          rc=$?
          set -e
          if [ "$rc" != 3 ]; then echo "unexpected baseline PI test result: $rc"; exit 1; fi
          echo "PASS: reproduced v0.7.0 lost small-error integrator"
      - name: Integrate corrected Q15 PI into gate-OFF v0.7.1 build
        run: python3 v0.7.1/apply_v071.py /tmp/v080
      - name: Add read-only DashBLE 0xDA-0xDF ADC pages (do not change login)
        run: python3 v0.7.2/apply_v072.py /tmp/v080
      - name: Import pinned parameterized R-L-flux motor observer and fix signed BEMF math
        run: |
          set -euxo pipefail
          echo "4c76c78595117f8b1ec6f7804f335fd091254fc1febb73281f7e13ef8e611e7c  v0.8.0/motor_core_v070_overlay.tar.xz" | sha256sum -c -
          python3 v0.8.0/apply_v080.py /tmp/v080 v0.8.0/motor_core_v070_overlay.tar.xz
          mkdir -p /tmp/v080_vendor
          tar -xJf v0.8.0/motor_core_v070_overlay.tar.xz -C /tmp/v080_vendor
          cp /tmp/v080_vendor/tools/motor_core_host_test.c /tmp/v080/tools/
          cp v0.7.2/tools/test_ble_motor_probe.c /tmp/v080/tools/
      - name: Negative-build test rejects ANY gate arming
        run: |
          set -euo pipefail
          if clang-18 --target=arm-none-eabi -mcpu=cortex-m3 -mthumb -ffreestanding -Isrc -DPOWER_STAGE_ARM_ALLOWED=1 -DSENSORLESS_RUN_ALLOWED=0 -fsyntax-only src/main.c > /tmp/armed.log 2>&1; then
            echo "FAIL: dangerous armed compilation succeeded"; exit 1
          fi
          grep -F 'must NEVER arm a physical power stage' /tmp/armed.log
        working-directory: /tmp/v080
      - name: Build gate-OFF passive motor probe only
        working-directory: /tmp/v080
        run: make clean safe CC=clang-18 OBJCOPY=llvm-objcopy-18 OBJDUMP=llvm-objdump-18
      - name: Test advanced motor observer and BLE snapshots with host UBSan
        env:
          HOST_CC: clang-18
        run: python3 v0.8.0/tools/test_motor_integration.py /tmp/v080
      - name: Emulate full SYNC-SAFE ARM USART2 firmware including repeated ACKs
        env:
          ARM_NM: llvm-nm-18
        run: |
          set -euxo pipefail
          cp /tmp/v080/build/DeltaESC_G30D_v0_8_0_ble_syncsafe.elf /tmp/v080/build/target_syncsafe.elf
          cp /tmp/v080/build/DeltaESC_G30D_v0_8_0_ble_syncsafe.bin /tmp/v080/build/target_syncsafe.bin
          python3 v0.6.10/full_target_protocol.py /tmp/v080 --retry --guard --blocks 130
      - name: Test actual ARM USART2 reads of all six new motor diagnostic registers
        env:
          ARM_NM: llvm-nm-18
        run: python3 v0.8.0/tools/test_arm_v080.py /tmp/v080
      - name: Test staged-IAP and stock bootloader error branches
        env:
          HOST_CC: clang-18
        run: |
          cp v0.6.8/tools/{iap_control_powercut_test.c,test_iap_powercut.py} /tmp/v080/tools/
          python3 /tmp/v080/tools/test_iap_powercut.py
          python3 v0.6.8/tools/test_stock_copy_faults.py
          python3 v0.6.8/tools/test_stock_error_paths.py
      - name: Run existing transport and dashboard regressions
        working-directory: /tmp/v080
        env:
          HOST_CC: clang-18
        run: |
          python3 tools/test_iap_ack.py
          python3 tools/test_iap_transport.py
          python3 tools/test_iap_crypto.py
          python3 tools/test_dashboard_runtime.py
      - name: Export SOURCE-ONLY audit, excluding all firmware images
        run: |
          tar --exclude=build --exclude=shu --exclude='__pycache__' -C /tmp/v080 -cJf /tmp/DeltaESC_v080_SENSORLESS_DASHBLE_SOURCE_ONLY.tar.xz .
          sha256sum /tmp/DeltaESC_v080_SENSORLESS_DASHBLE_SOURCE_ONLY.tar.xz
      - uses: actions/upload-artifact@v4
        with:
          name: DeltaESC-v0.8.0-SENSORLESS-DASHBLE-SOURCE-ONLY
          if-no-files-found: error
          retention-days: 30
          path: /tmp/DeltaESC_v080_SENSORLESS_DASHBLE_SOURCE_ONLY.tar.xz
