name: Audit DeltaESC v0.9.0 same-tick motor fault STOP, observer gate-off (SOURCE ONLY)
on:
  push:
    branches: ["dev/v0.9.0-first-spin-fault-stop-core-gateoff"]
    paths:
      - "v0.9.0/**"
      - ".github/workflows/build-v090-first-spin-safety.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned LLVM and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18 xz-utils patch
          python3 -m pip install unicorn==2.1.4
      - name: Reconstruct canonical v0.6.7 firmware
        run: |
          set -euxo pipefail
          mkdir -p /tmp/v061 /tmp/v090
          tar -xJf v0.6/DeltaESC_G30D_v0_6_source.tar.xz -C /tmp/v061
          xz -dc v0.6.1/v0611.patch.xz | patch -d /tmp/v061 -p1
          cp -a /tmp/v061/. /tmp/v090/
          xz -dc v0.6.2/v062.patch.xz | patch -d /tmp/v090 -p4
          xz -dc v0.6.3/v063.patch.xz | patch -d /tmp/v090 -p4
          xz -dc v0.6.4/v064.patch.xz | patch -d /tmp/v090 -p4
          xz -dc v0.6.5/v065.patch.xz | patch -d /tmp/v090 -p1
          cat v0.6.6/v066.patch.part-* > /tmp/v066.patch
          echo "dfab72dc0bf7869d595e041cb1a797a4ac5f50e2118c5011f99a5d7fc33abd0a  /tmp/v066.patch" | sha256sum -c -
          patch -d /tmp/v090 -p1 < /tmp/v066.patch
          cat v0.6.7/v067.patch.part-* > /tmp/v067.patch
          echo "430666ee2c9967973c5aaec1560385010ab531cc04d5e790ec28cf495a6c18a4  /tmp/v067.patch" | sha256sum -c -
          patch -d /tmp/v090 -p1 < /tmp/v067.patch
      - name: Apply v0.6.8-v0.6.10 update and power safety
        run: |
          set -euxo pipefail
          cp v0.6.8/src/iap_control.[ch] /tmp/v090/src/
          patch -d /tmp/v090 -p1 < v0.6.8/iap_powercut_core.patch
          python3 v0.6.9/apply_v069.py /tmp/v090
          patch -d /tmp/v090 -p1 < v0.6.10/iap_retry.patch
          test -z "$(find /tmp/v090 -name '*.rej' -print -quit)"
      - name: Reconstruct v0.7.0-v0.7.2 passive motor and DashBLE layers
        run: |
          set -euxo pipefail
          python3 v0.7.0/apply_v070.py /tmp/v090
          python3 v0.7.1/apply_v071.py /tmp/v090
          python3 v0.7.2/apply_v072.py /tmp/v090
      - name: Import v0.8.0 parameterized sensorless motor core
        run: |
          set -euxo pipefail
          echo "4c76c78595117f8b1ec6f7804f335fd091254fc1febb73281f7e13ef8e611e7c  v0.8.0/motor_core_v070_overlay.tar.xz" | sha256sum -c -
          python3 v0.8.0/apply_v080.py /tmp/v090 v0.8.0/motor_core_v070_overlay.tar.xz
          mkdir -p /tmp/v080_vendor
          tar -xJf v0.8.0/motor_core_v070_overlay.tar.xz -C /tmp/v080_vendor
          cp /tmp/v080_vendor/tools/motor_core_host_test.c /tmp/v090/tools/
          cp v0.7.2/tools/test_ble_motor_probe.c /tmp/v090/tools/
      - name: Apply v0.8.1 phone commissioning guard
        run: python3 v0.8.1/apply_v081.py /tmp/v090
      - name: Apply v0.8.2 stock current frontend model
        run: python3 v0.8.2/apply_v082.py /tmp/v090
      - name: Apply v0.8.3 stock dual-ADC acquisition plan
        run: python3 v0.8.3/apply_v083.py /tmp/v090
      - name: Merge magic-gated atomic F0-F5 parameter staging into commissioning firmware
        run: |
          python3 v0.8.4/apply_v084.py /tmp/v090
          cp v0.8.4/tools/motor_config_txn_test.c /tmp/v090/tools/
      - name: Decode and hash-pin audited live dual-ADC source overlay
        run: |
          set -euo pipefail
          cat v0.8.5/overlay.b64.part-* | base64 -d > /tmp/v090_overlay.tar.xz
          echo "59ed470aa8708b3e23d8571fb23b59a371b5a14dc09c0930f5b2cba51c0a8ed1  /tmp/v090_overlay.tar.xz" | sha256sum -c -
          mkdir -p /tmp/v090_overlay
          tar -xJf /tmp/v090_overlay.tar.xz -C /tmp/v090_overlay
          python3 /tmp/v090_overlay/apply_v085.py /tmp/v090
      - name: Apply v0.8.6 sample integrity and atomic E8 overlay (no gate changes)
        run: |
          python3 v0.8.6/apply_v086.py /tmp/v090
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/v090')
          main=(root/'src/main.c').read_text()
          make=(root/'Makefile').read_text()
          assert '#define FW_BUILD 0x0806u' in main
          assert 'case 0xE8u:' in main and 'case 0xE9u:' in main
          e8=main.split('case 0xE8u:')[1].split('case 0xE9u:')[0]
          assert 'irq_disable();' in e8 and 'irq_enable();' in e8
          assert e8.index('irq_disable();') < e8.index('put_u16(p,g_last_adc1_pair)')
          assert e8.index('irq_enable();') > e8.index('put_u16(p+14')
          assert 'quality & ADCQ_BAD_PAIR' in main
          assert 'power_stage_force_disarm();' in main
          assert 'g_safety_latched=0xA005u' in main
          for sentinel in ('#define COMM_CURRENT_SCALE_HW_VALID 0u','#define COMM_GATE_HW_VALID 0u','#define COMM_ADC_TIMING_HW_VALID 0u'):
            assert sentinel in main
          assert '-DPOWER_STAGE_ARM_ALLOWED=0 -DSENSORLESS_RUN_ALLOWED=0' in make
          assert 'active: ' not in make and 'bench: ' not in make
          print('PASS: source interlocks, atomic E8 read, E9 statistics, fail-closed ADC ISR')
          PY
      - name: Bind raw sample and channel evidence to one completed IRQ, read-only EA
        run: |
          python3 v0.8.7/apply_v087.py /tmp/v090
          python3 - <<'PY'
          from pathlib import Path
          src=Path('/tmp/v090/src/main.c').read_text()
          mk=Path('/tmp/v090/Makefile').read_text()
          assert '#define FW_BUILD 0x0807u' in src
          assert 'case 0xEAu:' in src and 'case 0xE8u:' in src and 'case 0xE9u:' in src
          assert 'stock_adc_snapshot_capture(&g_pair_snapshot' in src
          assert 'const uint32_t jsqr1=ADC_JSQR,jsqr2=ADC2_JSQR;' in src
          assert 'put_u16(p+14,(uint16_t)(g_pair_snapshot.adc2_jsqr&0xffffu));' in src
          assert src.index('stock_adc_snapshot_capture(&g_pair_snapshot') < src.index('stock_dual_adc_runtime_next_sector(&g_dual_adc')
          for sentinel in ('#define COMM_CURRENT_SCALE_HW_VALID 0u','#define COMM_GATE_HW_VALID 0u','#define COMM_ADC_TIMING_HW_VALID 0u'):
            assert sentinel in src
          assert 'src/stock_adc_snapshot.c' in mk
          assert 'active: ' not in mk and 'bench: ' not in mk
          print('PASS v0.8.7 compile safety and coherent E8/EA source ABI')
          PY
      - name: Apply read-only TIM1 capture and ADC IRQ cycle evidence
        run: |
          python3 v0.8.8/apply_v088.py /tmp/v090
          python3 - <<'PY'
          from pathlib import Path
          main=(Path('/tmp/v090')/'src/main.c').read_text()
          mk=(Path('/tmp/v090')/'Makefile').read_text()
          assert '#define FW_BUILD 0x0808u' in main
          assert 'case 0xEBu:' in main and 'case 0xECu:' in main
          assert 'stock_adc_timing_capture(&g_timer_evidence' in main
          assert 'stock_adc_timing_encode_eb(&g_timer_evidence,p);' in main
          assert 'stock_adc_timing_encode_ec(&g_timer_evidence,p);' in main
          assert main.index('stock_adc_timing_capture(&g_timer_evidence') < main.index('const uint16_t s1=(uint16_t)ADC_JDR1')
          for macro in ('#define COMM_GATE_HW_VALID 0u','#define COMM_CURRENT_SCALE_HW_VALID 0u','#define COMM_ADC_TIMING_HW_VALID 0u'):
            assert macro in main
          assert '-DPOWER_STAGE_ARM_ALLOWED=0 -DSENSORLESS_RUN_ALLOWED=0' in mk
          assert 'src/stock_adc_timing.c' in mk and 'active: ' not in mk
          print('PASS versioned EB/EC read-only timing evidence; gate macros OFF')
          PY
      - name: Apply atomic correlation of completed ADC pair and TIM1 evidence
        run: |
          python3 v0.8.9/apply_v089.py /tmp/v090
          python3 - <<'PY'
          from pathlib import Path
          main=Path('/tmp/v090/src/main.c').read_text()
          make=Path('/tmp/v090/Makefile').read_text()
          assert '#define FW_BUILD 0x0809u' in main
          assert 'case 0xEDu:' in main
          assert 'stock_adc_correlated_capture(&g_correlated_evidence' in main
          assert 'stock_adc_correlated_encode_ed(&g_correlated_evidence,p);' in main
          assert main.index('stock_adc_correlated_capture(&g_correlated_evidence') < main.index('stock_dual_adc_runtime_next_sector(&g_dual_adc')
          assert 'stock_adc_correlated.c' in make
          assert '-DPOWER_STAGE_ARM_ALLOWED=0 -DSENSORLESS_RUN_ALLOWED=0' in make
          assert 'active: ' not in make and 'bench: ' not in make
          for m in ('#define COMM_GATE_HW_VALID 0u','#define COMM_CURRENT_SCALE_HW_VALID 0u','#define COMM_ADC_TIMING_HW_VALID 0u'):
              assert m in main
          print('PASS v0.8.9 ED single ISR correlation and all gate interlocks')
          PY
      - name: Fix STM32F103 DUALMOD from 0001 to injected-only 0101 and reject missing ADC2 JEOC
        run: |
          python3 v0.8.10/apply_v0810.py /tmp/v090
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/v090')
          hdr=(root/'src/stock_dual_adc_plan.h').read_text()
          main=(root/'src/main.c').read_text()
          mk=(root/'Makefile').read_text()
          assert 'STOCK_ADC_MODE_REG_INJEC_SIMULT = 0x00050000u' in hdr
          assert 'STOCK_ADC_MODE_REG_INJEC_SIMULT = 0x00010000u' not in hdr
          assert '#define FW_BUILD 0x080Au' in main
          assert 'case 0xEEu:' in main
          assert 'g30_adc_mode_capture(&g_adc_mode_guard' in main
          assert 'adc_mode_fault&G30_ADCMODE_ADC2_NOT_READY' in main
          assert 'if ((quality & ADCQ_BAD_PAIR) || adc_mode_fault)' in main
          assert 'stock_adc_correlated_capture(&g_correlated_evidence' in main
          assert main.index('g30_adc_mode_capture(&g_adc_mode_guard')<main.index('const uint16_t s2=')
          for marker in ('#define COMM_GATE_HW_VALID 0u','#define COMM_ADC_TIMING_HW_VALID 0u','#define COMM_CURRENT_SCALE_HW_VALID 0u'):
              assert marker in main
          assert '-DPOWER_STAGE_ARM_ALLOWED=0 -DSENSORLESS_RUN_ALLOWED=0' in mk
          assert 'active: ' not in mk and 'bench: ' not in mk
          print('PASS STM32 DUALMOD=0101, ADC2 completion check, gate-OFF and EE read-only evidence')
          PY
      - name: Apply pinned v0.8.11 two-rank fixed injected ADC source with verified hash
        run: |
          set -euo pipefail
          echo "9f9073476f69a84938fbe2e74e73baaf764691ac252baac60d85a1e03dc22b1b  v0.8.11/fixed_adc_overlay.tar.xz" | sha256sum -c -
          mkdir -p /tmp/v090_overlay
          tar -xJf v0.8.11/fixed_adc_overlay.tar.xz -C /tmp/v090_overlay
          python3 /tmp/v090_overlay/apply_v0811.py /tmp/v090
          python3 - <<'PY'
          from pathlib import Path
          r=Path('/tmp/v090')
          s=(r/'src/main.c').read_text()
          h=(r/'src/g30_fixed_scan.h').read_text()
          assert '#define FW_BUILD 0x080Bu' in s
          assert 'case 0xEFu:' in s and 'g30_fixed_scan_capture(&g_fixed_scan' in s
          assert 'ADC_JSQR=G30_FIXED_JSQR_A' in s
          assert 'ADC2_JSQR=G30_FIXED_JSQR_B' in s
          irq=s.split('void ADC1_2_IRQHandler(void) {',1)[1].split('static void put_u16(',1)[0]
          assert 'ADC_JSQR=' not in irq and 'ADC2_JSQR=' not in irq
          assert 'stock_dual_adc_runtime_next_sector' not in irq
          assert 'stock_current_reconstruct_counts' not in irq
          assert 'sensorless_control_step(&ctrl,current,g_adc_raw[3],PWM_ARR,0u);' in irq
          for x in ('#define COMM_GATE_HW_VALID 0u','#define COMM_CURRENT_SCALE_HW_VALID 0u','#define COMM_ADC_TIMING_HW_VALID 0u'):
            assert x in s
          m=(r/'Makefile').read_text()
          assert '-DPOWER_STAGE_ARM_ALLOWED=0 -DSENSORLESS_RUN_ALLOWED=0' in m
          assert 'active: ' not in m and 'bench: ' not in m
          assert 'G30_FIXED_JSQR_A' in h and 'G30_FIXED_JSQR_B' in h
          print('PASS fixed static two-rank ADC scan: no JSQR writes in interrupt; E0 offsets; hard gate-off')
          PY
      - name: Apply SHA-verified v0.8.12 stable-offset quality checks and F6 read-only diagnostic
        run: |
          set -euo pipefail
          cat v0.8.12/overlay.b64.part-* | base64 -d > /tmp/v090_offset_overlay.tar.xz
          echo "8af936d98b6aa5d54066d8e2daf45c82506a7ac808ff1d715ed1d7f019775b44  /tmp/v090_offset_overlay.tar.xz" | sha256sum -c -
          mkdir -p /tmp/v090_offset_overlay
          tar -xJf /tmp/v090_offset_overlay.tar.xz -C /tmp/v090_offset_overlay
          python3 /tmp/v090_offset_overlay/apply_v0812.py /tmp/v090
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/v090')
          main=(root/'src/main.c').read_text()
          source=(root/'src/g30_fixed_scan.c').read_text()
          hdr=(root/'src/g30_fixed_scan.h').read_text()
          mk=(root/'Makefile').read_text()
          assert '#define FW_BUILD 0x080Cu' in main
          assert 'case 0xF6u:' in main
          assert 'g30_fixed_scan_encode_f6(&g_fixed_scan,p)' in main
          assert 'G30_SCAN_CAL_UNSTABLE' in hdr and 'G30_FIXED_CAL_MAX_P2P_COUNTS 64u' in hdr
          assert 'G30_FIXED_CAL_MAX_DUP_DELTA_COUNTS 32u' in hdr
          assert 'duplicate_delta>G30_FIXED_CAL_MAX_DUP_DELTA_COUNTS' in source
          assert 'high-low' in source and 'G30_FIXED_CAL_MAX_P2P_COUNTS' in source
          assert 'iap_update_pending()||iap_update_active()||g_dash_throttle||g_dash_brake' in main
          assert 'if(g_offset_cal_valid && !g_safety_latched)' in main
          assert 'sensorless_control_stop(&ctrl)' in main
          assert 'src/g30_fixed_scan.c' in mk
          for sentinel in ('#define COMM_CURRENT_SCALE_HW_VALID 0u','#define COMM_GATE_HW_VALID 0u','#define COMM_ADC_TIMING_HW_VALID 0u'):
              assert sentinel in main
          assert '-DPOWER_STAGE_ARM_ALLOWED=0 -DSENSORLESS_RUN_ALLOWED=0' in mk
          assert 'active: ' not in mk and 'bench: ' not in mk
          print('PASS fail-closed offset qualification, F6 read-only ABI and MOTOR GATES OFF')
          PY
      - name: Apply first-spin motor-core same-tick fault and synchronous stop safety patch
        run: |
          cp /tmp/v090/src/sensorless_control.c /tmp/v090_motor_core_before.c
          python3 v0.9.0/apply_v090.py /tmp/v090
          python3 - <<'PY'
          from pathlib import Path
          r=Path('/tmp/v090')
          main=(r/'src/main.c').read_text()
          core=(r/'src/sensorless_control.c').read_text()
          hdr=(r/'src/sensorless_control.h').read_text()
          mk=(r/'Makefile').read_text()
          assert '#define FW_BUILD 0x0900u' in main
          assert 'pwm_arr_last' in hdr
          assert 'zero_vector(s,s->pwm_arr_last);' in core
          assert 'if (s->state == SENSORLESS_FAULT || s->fault)' in core
          assert core.index('if (!power_armed || !s->drive_request || s->fault)') < core.index('observer_update(s, i_alpha, i_beta, vbus_adc);')
          assert '-DPOWER_STAGE_ARM_ALLOWED=0 -DSENSORLESS_RUN_ALLOWED=0' in mk
          assert 'active: ' not in mk and 'bench: ' not in mk
          for guard in ('#define COMM_GATE_HW_VALID 0u','#define COMM_CURRENT_SCALE_HW_VALID 0u','#define COMM_ADC_TIMING_HW_VALID 0u'):
              assert guard in main
          print('PASS motor-core safety source: no fault-cycle drive, no unpowered observer, hardware gated OFF')
          PY
      - name: Negative build rejects any gate arming
        working-directory: /tmp/v090
        run: |
          set -euo pipefail
          if clang-18 --target=arm-none-eabi -mcpu=cortex-m3 -mthumb -ffreestanding -Isrc -DPOWER_STAGE_ARM_ALLOWED=1 -DSENSORLESS_RUN_ALLOWED=0 -fsyntax-only src/main.c > /tmp/armed.log 2>&1; then
            echo "FAIL: dangerous armed compilation succeeded"; exit 1
          fi
          grep -F 'motor power ALWAYS disabled' /tmp/armed.log
      - name: Build gate-OFF SYNC-SAFE target only
        working-directory: /tmp/v090
        run: make clean safe CC=clang-18 OBJCOPY=llvm-objcopy-18 OBJDUMP=llvm-objdump-18
      - name: Test fixed injected rank 1/2 channels, duplicate CH5, 512 offsets and fail-closed guards under UBSan
        working-directory: /tmp/v090
        run: |
          clang-18 -std=c11 -O1 -Wall -Wextra -Werror -fsanitize=undefined \
            -fno-sanitize-recover=all -Isrc \
            src/g30_fixed_scan.c src/stock_adc_mode_guard.c tools/test_g30_fixed_scan.c \
            -o build/fixed_scan_host
          build/fixed_scan_host
      - name: Assert conservative 512-offset quality rejects noisy or inconsistent CH5 ranks under UBSan
        working-directory: /tmp/v090
        run: |
          clang-18 -std=c11 -O1 -Wall -Wextra -Werror \
            -fsanitize=undefined -fno-sanitize-recover=all -Isrc \
            src/g30_fixed_scan.c src/stock_adc_mode_guard.c tools/test_g30_fixed_scan.c \
            -o build/host_offset_quality
          build/host_offset_quality
      - name: Test actual six-sector ADC runtime and per-phase offset calibration
        working-directory: /tmp/v090
        run: |
          clang-18 -std=c11 -O1 -Wall -Wextra -Werror -fsanitize=undefined \
            -fno-sanitize-recover=all -Isrc \
            src/stock_current_frontend.c src/stock_dual_adc_plan.c \
            src/stock_dual_adc_runtime.c tools/stock_dual_adc_runtime_host_test.c \
            -o build/dual_adc_runtime_host
          build/dual_adc_runtime_host
          grep -F 'ADC2_JDR1' src/main.c
          grep -F 'case 0xE8u:' src/main.c
          grep -F 'ADC_CR2_EXTSEL_SWSTART' src/main.c
          grep -F 'ADC2_CR2=ADC_CR2_ADON|ADC_CR2_JEXTSEL_JSWSTART|ADC_CR2_JEXTTRIG' src/main.c
          grep -F '#define COMM_ADC_TIMING_HW_VALID 0u' src/main.c
          grep -F '#define COMM_GATE_HW_VALID 0u' src/main.c
          grep -F '#define FW_BUILD 0x0900u' src/main.c
      - name: Test six-sector ADC sample-integrity, counter saturation and invalid-channel rejection
        working-directory: /tmp/v090
        run: |
          clang-18 -std=c11 -O1 -Wall -Wextra -Werror -fsanitize=undefined \
            -fno-sanitize-recover=all -Isrc \
            src/stock_adc_quality.c src/stock_current_frontend.c \
            tools/stock_adc_quality_host_test.c -o build/host_adc_quality
          build/host_adc_quality
      - name: Test 16-byte EA sample evidence across all six sectors under UBSan
        working-directory: /tmp/v090
        run: |
          clang-18 -std=c11 -O1 -Wall -Wextra -Werror -fsanitize=undefined \
            -fno-sanitize-recover=all -Isrc \
            src/stock_adc_snapshot.c src/stock_current_frontend.c \
            tools/stock_adc_snapshot_host_test.c -o build/host_adc_snapshot
          build/host_adc_snapshot
      - name: Test TIM1 ADC IRQ evidence, wraparound and gate-mask register safety
        working-directory: /tmp/v090
        run: |
          clang-18 -std=c11 -O1 -Wall -Wextra -Werror -fsanitize=undefined \
            -fno-sanitize-recover=all -Isrc \
            src/stock_adc_timing.c tools/stock_adc_timing_host_test.c \
            -o build/host_adc_timer
          build/host_adc_timer
      - name: Test correlated 16-byte ED payload, six sectors and fault bits under UBSan
        working-directory: /tmp/v090
        run: |
          clang-18 -std=c11 -O1 -Wall -Wextra -Werror -fsanitize=undefined \
            -fno-sanitize-recover=all -Isrc \
            src/stock_adc_correlated.c src/stock_adc_timing.c src/stock_adc_snapshot.c \
            src/stock_current_frontend.c tools/test_stock_adc_correlated.c \
            -o build/host_correlated
          build/host_correlated
      - name: Assert injected-only DUALMOD 0101, ADC2 JEOC and EE safety ABI with UBSan
        working-directory: /tmp/v090
        run: |
          clang-18 -std=c11 -O1 -Wall -Wextra -Werror \
            -fsanitize=undefined -fno-sanitize-recover=all -Isrc \
            src/stock_adc_mode_guard.c src/stock_dual_adc_plan.c \
            src/stock_current_frontend.c tools/test_stock_adc_mode_guard.c \
            -o build/host_adc_mode_guard
          build/host_adc_mode_guard
      - name: Test stock DRV126 current frontend and dual-ADC plan
        env:
          HOST_CC: clang-18
        run: |
          python3 v0.8.2/tools/test_stock_current_frontend.py /tmp/v090
          # Historical v0.8.3 test intentionally asserts the OLD and unsafe DUALMOD=0001.
          # The dedicated v0.8.10 test above replaces that obsolete expectation.
          grep -F 'STOCK_ADC_MODE_REG_INJEC_SIMULT = 0x00050000u' /tmp/v090/src/stock_dual_adc_plan.h
      - name: Test commissioning guard truth table
        env:
          HOST_CC: clang-18
        run: python3 v0.8.1/tools/test_commissioning_guard.py /tmp/v090
      - name: Prove frozen v0.8.12 fails NEW motor-stop safety test but fixed v0.9.0 passes
        working-directory: /tmp/v090
        run: |
          set -euo pipefail
          clang-18 -std=c11 -O1 -Wall -Wextra -Werror -Isrc \
            -DSENSORLESS_CLOSED_LOOP_ALLOWED=1 -DMOTOR_VOLTAGE_BENCH=0 \
            tools/first_spin_safety_host_test.c /tmp/v090_motor_core_before.c \
            -o build/before_motor_stop_safety
          if build/before_motor_stop_safety > build/old_safety_failed_as_expected.log 2>&1; then
            echo "FAIL: regression test should FAIL on frozen v0.8.12"; exit 1
          fi
          grep -F 'FAIL neutral(&s,1000)' build/old_safety_failed_as_expected.log
          for close in 0 1; do
            clang-18 -std=c11 -O1 -Wall -Wextra -Werror \
              -fsanitize=undefined -fno-sanitize-recover=all -Isrc \
              -DSENSORLESS_CLOSED_LOOP_ALLOWED=$close -DMOTOR_VOLTAGE_BENCH=0 \
              tools/first_spin_safety_host_test.c src/sensorless_control.c \
              -o build/motor_stop_safety_$close
            build/motor_stop_safety_$close
          done
      - name: Test motor-core numerical and original passive BLE host regressions
        working-directory: /tmp/v090
