name: Build DeltaESC G30D v0.6.6 PA12 power fix
on:
  push:
    branches: [ "dev/v0.6.6-power-button-pa12" ]
    paths: [ "v0.6.6/**", ".github/workflows/build-v066-power.yml" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18 xz-utils patch
          clang-18 --version | head -n 1
      - name: Reconstruct v0.6.6 source
        run: |
          mkdir -p /tmp/v061 /tmp/v066
          tar -xJf v0.6/DeltaESC_G30D_v0_6_source.tar.xz -C /tmp/v061
          xz -dc v0.6.1/v0611.patch.xz | patch -d /tmp/v061 -p1
          cp -a /tmp/v061/. /tmp/v066/
          xz -dc v0.6.2/v062.patch.xz | patch -d /tmp/v066 -p4
          xz -dc v0.6.3/v063.patch.xz | patch -d /tmp/v066 -p4
          xz -dc v0.6.4/v064.patch.xz | patch -d /tmp/v066 -p4
          xz -dc v0.6.5/v065.patch.xz | patch -d /tmp/v066 -p1
          xz -dc v0.6.6/v066.patch.xz | patch -d /tmp/v066 -p1
      - name: Build matrix
        working-directory: /tmp/v066
        run: make clean all CC=clang-18 OBJCOPY=llvm-objcopy-18 OBJDUMP=llvm-objdump-18
      - name: Stock DRV126 IAP ACK vector
        working-directory: /tmp/v066
        run: python3 tools/test_iap_ack.py
      - name: Stock 128-byte IAP transport
        working-directory: /tmp/v066
        run: python3 tools/test_iap_transport.py
      - name: v0.6.6 PA12 power and identity preflight
        working-directory: /tmp/v066
        run: python3 tools/preflight_v066.py
      - name: NinebotTEA regression
        working-directory: /tmp/v066
        run: python3 tools/test_iap_crypto.py
      - name: Power button state-machine test
        working-directory: /tmp/v066
        env:
          HOST_CC: clang-18
        run: python3 tools/test_power_logic.py
      - name: SHU ZIP3 preflight
        working-directory: /tmp/v066
        run: python3 tools/test_shu_package.py
      - name: Build SAFE-only SHU package
        working-directory: /tmp/v066
        run: |
          mkdir -p shu
          python3 tools/make_shu_zip.py             build/DeltaESC_G30D_v0_6_6_ble_syncsafe.bin             shu/DeltaESC_G30D_v0_6_6_SHU_SYNC_SAFE.zip             --name "DeltaESC G30D v0.6.6 SAFE" --variant syncsafe
          tar --exclude=build --exclude=shu -C /tmp/v066 -cJf /tmp/DeltaESC_G30D_v0_6_6_source.tar.xz .
          sha256sum build/*.bin shu/*.zip /tmp/DeltaESC_G30D_v0_6_6_source.tar.xz
      - uses: actions/upload-artifact@v4
        with:
          name: DeltaESC-G30D-v0.6.6-PA12-power
          retention-days: 30
          if-no-files-found: error
          path: |
            /tmp/v066/build/*.bin
            /tmp/v066/shu/DeltaESC_G30D_v0_6_6_SHU_SYNC_SAFE.zip
            /tmp/DeltaESC_G30D_v0_6_6_source.tar.xz
            /tmp/v066/README.md
