name: Android Tool Debug APK
on:
  push:
    branches: [ "dev/android-tool-v0.1" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Extract Android project
        run: |
          mkdir -p /tmp/deltaesc-android
          tar -xJf android/DeltaESC_Android_v0_1_source.tar.xz -C /tmp/deltaesc-android
      - name: Build debug APK
        working-directory: /tmp/deltaesc-android/DeltaESC_Android_v0_1
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DeltaESC-Tool-v0.1-debug
          path: /tmp/deltaesc-android/DeltaESC_Android_v0_1/app/build/outputs/apk/debug/app-debug.apk
