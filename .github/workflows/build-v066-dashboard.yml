name: Build DeltaESC G30D v0.6.6 dashboard-drive RC
on:
  push:
    branches: [ "dev/v0.6.6-dashboard-drive-rc" ]
    paths: [ "v0.6.6/**", ".github/workflows/build-v066-dashboard.yml" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18 xz-utils patch
      - name: Reconstruct v0.6.6 from frozen v0.6.5 chain
        run: |
          mkdir -p /tmp/v061 /tmp/v066
          tar -xJf v0.6/DeltaESC_G30D_v0_6_source.tar.xz -C /tmp/v061
          xz -dc v0.6.1/v0611.patch.xz | patch -d /tmp/v061 -p1
          cp -a /tmp/v061/. /tmp/v066/
          xz -dc v0.6.2/v062.patch.xz | patch -d /tmp/v066 -p4
          xz -dc v0.6.3/v063.patch.xz | patch -d /tmp/v066 -p4
          xz -dc v0.6.4/v064.patch.xz | patch -d /tmp/v066 -p4
          xz -dc v0.6.5/v065.patch.xz | patch -d /tmp/v066 -p1
          cat v0.6.6/v066.patch.xz.b64.* | tr -d '\\n' | base64 -d > /tmp/v066.patch.xz\n          xz -t /tmp/v066.patch.xz\n          xz -dc /tmp/v066.patch.xz | patch -d /tmp/v066 -p1
      - name: Build SAFE / observer / bench / dashboard RC
        working-directory: /tmp/v066
        run: make clean all CC=clang-18 OBJCOPY=llvm-objcopy-18 OBJDUMP=llvm-objdump-18
      - name: Stock IAP vectors
        working-directory: /tmp/v066
        env: { HOST_CC: clang-18 }
        run: |
          python3 tools/test_iap_ack.py
          python3 tools/test_iap_transport.py
          python3 tools/test_iap_crypto.py
      - name: Runtime observer parameter test
        working-directory: /tmp/v066
        env: { HOST_CC: clang-18 }
        run: python3 tools/test_motor_params.py
      - name: G30 dashboard safety test
        working-directory: /tmp/v066
        run: python3 tools/test_dashboard_protocol.py
      - name: v0.6.6 preflight
        working-directory: /tmp/v066
        run: python3 tools/preflight_v066.py
      - name: SHU package regression
        working-directory: /tmp/v066
        run: python3 tools/test_shu_package.py
      - name: Build first-flash SAFE package only
        working-directory: /tmp/v066
        run: |
          mkdir -p shu
          python3 tools/make_shu_zip.py build/DeltaESC_G30D_v0_6_6_ble_syncsafe.bin shu/DeltaESC_G30D_v0_6_6_SHU_SYNC_SAFE.zip --name "DeltaESC G30D v0.6.6 SAFE" --variant syncsafe
          python3 - <<'PY'
          import hashlib,json,zipfile
          p='shu/DeltaESC_G30D_v0_6_6_SHU_SYNC_SAFE.zip'
          with zipfile.ZipFile(p) as z:
              assert set(z.namelist()) == {'FIRM.bin.enc','info.json','params.txt'}
              i=json.loads(z.read('info.json'))['firmware']
              assert i['encryption']=='encrypted'
              assert i['compatible']==['max_DRV_STM32F103CxT6']
              assert hashlib.md5(z.read('FIRM.bin.enc')).hexdigest()==i['md5']['enc']
          PY
      - name: Package reproducible source and hashes
        run: |
          tar --exclude=build --exclude=shu -C /tmp/v066 -cJf /tmp/DeltaESC_G30D_v0_6_6_source.tar.xz .
          (cd /tmp/v066 && sha256sum build/*.bin shu/*.zip)
          sha256sum /tmp/DeltaESC_G30D_v0_6_6_source.tar.xz
      - uses: actions/upload-artifact@v4
        with:
          name: DeltaESC-G30D-v0.6.6-dashboard-drive-RC
          retention-days: 30
          if-no-files-found: error
          path: |
            /tmp/v066/build/*.bin
            /tmp/v066/shu/DeltaESC_G30D_v0_6_6_SHU_SYNC_SAFE.zip
            /tmp/DeltaESC_G30D_v0_6_6_source.tar.xz
            /tmp/v066/README.md
