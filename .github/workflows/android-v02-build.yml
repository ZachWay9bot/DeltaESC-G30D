name: Build DeltaESC Android v0.2 PRE-FLIGHT
on:
  push:
    branches: [ "dev/android-tool-v0.2" ]
    paths:
      - "android/v0.2/source/**"
      - ".github/workflows/android-v02-build.yml"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Protocol and MIC self-test
        working-directory: android/v0.2/source
        run: |
          SRC=app/src/main/java/de/deltaesc/tool
          mkdir -p /tmp/java-test
          cat > /tmp/ProtocolSelfTest.java <<'JAVA'
          package de.deltaesc.tool;
          import java.util.Arrays;
          final class ProtocolSelfTest {
            static void ok(boolean x,String m){if(!x)throw new AssertionError(m);}
            public static void main(String[] a){
              byte[] r=NinebotProtocol.read(0x1A,2);
              ok(Arrays.equals(r,new byte[]{0x5A,(byte)0xA5,1,0x3E,0x20,1,0x1A,2}),"read");
              byte[] id=NinebotProtocol.build(0x3E,0x04,0xD0,new byte[]{'D','E','S','C',0,1,3,6,0,0,0,0,(byte)0x80,0x3E,(byte)0xA0,0x0F});
              ok(DeltaEscProtocol.isDeltaEscIdentity(NinebotProtocol.decode(id)),"identity");
              NinebotCrypto tx=new NinebotCrypto("NBScooter2088");
              NinebotCrypto rx=new NinebotCrypto("NBScooter2088");
              byte[] enc=tx.encrypt(NinebotProtocol.init());
              ok(Arrays.equals(rx.decryptVerified(enc),NinebotProtocol.init()),"crypto");
              byte[] bad=enc.clone();bad[bad.length-4]^=1;
              boolean rejected=false;try{new NinebotCrypto("NBScooter2088").decryptVerified(bad);}catch(SecurityException e){rejected=true;}
              ok(rejected,"MIC tamper accepted");
              System.out.println("Protocol/MIC/identity: PASS");
            }
          }
          JAVA
          javac -d /tmp/java-test "$SRC/Hex.java" "$SRC/NinebotProtocol.java" "$SRC/NinebotCrypto.java" "$SRC/DeltaEscProtocol.java" /tmp/ProtocolSelfTest.java
          java -cp /tmp/java-test de.deltaesc.tool.ProtocolSelfTest
      - name: Enforce read-only gate
        run: |
          grep -F 'if(NinebotProtocol.isEscWrite(plain))' android/v0.2/source/app/src/main/java/de/deltaesc/tool/BleUartClient.java
          ! grep -R 'DeltaEscProtocol.action\|DeltaEscProtocol.startTest\|DeltaEscProtocol.commit' android/v0.2/source/app/src/main/java/de/deltaesc/tool/MainActivity.java
      - name: Build debug APK
        working-directory: android/v0.2/source
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Package
        run: |
          cp android/v0.2/source/app/build/outputs/apk/debug/app-debug.apk /tmp/DeltaESC_Android_v0_2_PREFLIGHT_READONLY.apk
          tar --exclude='app/build' -C android/v0.2/source -cJf /tmp/DeltaESC_Android_v0_2_source.tar.xz .
          sha256sum /tmp/DeltaESC_Android_v0_2_PREFLIGHT_READONLY.apk /tmp/DeltaESC_Android_v0_2_source.tar.xz
      - uses: actions/upload-artifact@v4
        with:
          name: DeltaESC-Android-v0.2-PREFLIGHT-READONLY
          retention-days: 30
          if-no-files-found: error
          path: |
            /tmp/DeltaESC_Android_v0_2_PREFLIGHT_READONLY.apk
            /tmp/DeltaESC_Android_v0_2_source.tar.xz
