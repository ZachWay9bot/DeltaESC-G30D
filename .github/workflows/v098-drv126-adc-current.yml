name: DeltaESC v0.9.8 DRV126 ADC current port checks
on:
  push:
    branches:
      - dev/v0.9.8-drv126-proven-adc-current
    paths:
      - 'v0.9.8/**'
      - '.github/workflows/v098-drv126-adc-current.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  stm32-f103-current:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM compiler and host UBSan
        run: sudo apt-get update -qq && sudo apt-get install -y clang-18 llvm-18 gcc
      - name: Recover pinned unmodified v0.9.0 code
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p base source
          gh run download 37996878172 --repo "${{ github.repository }}" --name DeltaESC-v0.9.0-FIRSTSPIN-STOP-SAFETY-GATEOFF-SOURCE-ONLY --dir base
          echo 'b66dc23226b18d8936c4d526f3a78d69e6b8c927e40ecc4c2dc84277ceee89d4  base/DeltaESC_v090_FIRSTSPIN_STOP_SAFETY_GATEOFF_SOURCE_ONLY.tar.xz' | sha256sum -c -
          tar -xJf base/DeltaESC_v090_FIRSTSPIN_STOP_SAFETY_GATEOFF_SOURCE_ONLY.tar.xz -C source
      - name: Apply versioned overlays in order
        run: |
          set -euo pipefail
          apply() {
            python3 -c 'import pathlib,sys; x=pathlib.Path(sys.argv[1]).read_bytes(); sys.stdout.buffer.write(x if x.endswith(b"\n") else x+b"\n")' "$1" | patch -s --batch --forward -p1 -d source
          }
          apply v0.9.1/v091_pinmap_safety.patch
          cp v0.9.1/tools/pinmap_power_regression_test.py source/tools/
          cp v0.9.1/tools/run_v091_tests.sh source/tools/
          apply v0.9.2/v092_foc_adc_contract.patch
          apply v0.9.3/v093_motor_id.patch
          apply v0.9.4/v094_motor_pipeline.patch
          apply v0.9.5/v095_drv126_gate.patch
          apply v0.9.6/v096_vesc_ebics_port.patch
          apply v0.9.7/v097_adc_current_only.patch
          apply v0.9.8/v098_ADC_DRV126_REFERENCE.patch
      - name: Rebuild STM32F103 and run 22 UBSan host test groups
        run: |
          set -euo pipefail
          cd source
          make clean
          ARM_CC=clang-18 ARM_OBJCOPY=llvm-objcopy-18 ARM_OBJDUMP=llvm-objdump-18 bash tools/run_v098_tests.sh
          test "$(stat -c %s build/DeltaESC_G30D_v0_9_8_ble_syncsafe.bin)" -lt 53248
          grep -Fq '#define FW_BUILD 0x0908u' src/main.c
          grep -Fq '#define COMM_CURRENT_SCALE_HW_VALID 0u' src/main.c
          grep -Fq '#define COMM_ADC_TIMING_HW_VALID 0u' src/main.c
          echo "ADC stock reference software tests passed; source only, motor-gate unqualified"
