name: G30 EBiCS r6 read-only D0 E0 D8 Android v0.3.9
on:
  pull_request:
    branches: [ "dev/android-v0.3.8-adcproof-v0919" ]
  push:
    branches: [ "dev/android-r6-readonly-diagnostics-2026-10-13" ]
    paths:
      - "android/v0.3.2/**"
      - "android/v0.3.5/**"
      - "android/v0.3.6/**"
      - "android/v0.3.7/**"
      - "android/v0.3.8/**"
      - "android/v0.3.9/**"
      - "android/v0.3.1/**"
      - ".github/workflows/android-v039-r6-readonly.yml"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Reconstruct frozen v0.3.0 source
        run: |
          mkdir -p /tmp/app
          tar -xJf android/DeltaESC_Android_v0_1_source.tar.xz -C /tmp/app
          mv /tmp/app/DeltaESC_Android_v0_1 /tmp/app/v031
          cat android/v0.2/chunks/*.b64 | tr -d '\n\r ' | base64 -d > /tmp/android_v02.patch.xz
          echo "269e9793c3bcbb7abf7cb7cd74d24d460a6cc070eadf9658cec515d76b46d7ec  /tmp/android_v02.patch.xz" | sha256sum -c -
          xz -dc /tmp/android_v02.patch.xz | patch -d /tmp/app/v031 -p1
          rm -f /tmp/app/v031/app/src/main/java/de/deltaesc/tool/DeltaEscProtocol.java
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/app/v031/app/src/main/java/de/deltaesc/tool/MainActivity.java')
          s=p.read_text()
          old='private void readDeltaSnapshot(){if(stage!=4){toast("Nicht angemeldet");return;}int[] r={0xD0,0xD1,0xD8,0xD9};'
          new='private void readDeltaSnapshot(){if(stage!=4){toast("Nicht angemeldet");return;}if(!deltaDetected){toast("DeltaESC-Signatur fehlt; Snapshot gesperrt");return;}int[] r={0xD0,0xD1,0xD8,0xD9};'
          assert old in s
          p.write_text(s.replace(old,new))
          PY
          echo "5ab8ab7a389795c26d7049f1e2e6aeadccf72bfb0e2d3cc08bb8b05de98678d2  android/v0.2.2/v022.patch.xz" | sha256sum -c -
          xz -dc android/v0.2.2/v022.patch.xz | patch -d /tmp/app/v031 -p1
          echo "adee921e20c9e183cd2f118f792c198e379286ef4a42614a1bc968128645e504  android/v0.2.3/v023.patch.xz" | sha256sum -c -
          xz -dc android/v0.2.3/v023.patch.xz | patch -d /tmp/app/v031 -p1
          python3 android/v0.3.0/apply_v030.py /tmp/app/v031
      - name: Apply v0.3.1 motor bench overlay
        run: python3 android/v0.3.1/apply_v031.py /tmp/app/v031
      - name: Adapt app to v0.7.2 build 0x0720
        run: python3 android/v0.3.2/apply_v032.py /tmp/app/v031
      - name: Apply v0.3.5 Motor-ID controls, preserving tested NinebotCrypto
        run: python3 android/v0.3.5/apply_v035.py /tmp/app/v031
      - name: Match VESC-method Motor-ID firmware and retain encrypted transport
        run: python3 android/v0.3.6/apply_v036.py /tmp/app/v031
      - name: Apply existing v0.3.7 read-only FA/FB GUI
        run: python3 android/v0.3.7/apply_v037.py /tmp/app/v031
      - name: Retarget FA/FB to combined Motor-RC 0x0919, preserve crypto
        run: python3 android/v0.3.8/apply_v038.py /tmp/app/v031
      - name: Adapt existing read-only UI to real EBiCS r6
        run: python3 android/v0.3.9/apply_v039_r6.py /tmp/app/v031
      - name: Verify r6 only read commands and unchanged original BLE transport
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('/tmp/app/v031/app/src/main/java/de/deltaesc/tool')
          pinned={
            'BleUartClient.java':'3bbf0a9e06dd277ef30cecae9baf579f8f843b0e5db505853cfe78c916b14485',
            'NinebotCrypto.java':'57d88389891ad2fe5dc42dc69748c2a81dc24edc3930081a74ceee45ae035705',
            'NinebotProtocol.java':'866fb803a439faf78ce50655cf54cae15a4467766826088e0bfa86b8468e84a3'}
          for n,h in pinned.items():assert hashlib.sha256((root/n).read_bytes()).hexdigest()==h,n
          main=(root/'MainActivity.java').read_text()
          diag=(root/'R6ReadOnlyTelemetry.java').read_text()
          grad=Path('/tmp/app/v031/app/build.gradle').read_text()
          assert 'addR6Controls();' in main
          assert 'sendEncrypted(R6ReadOnlyTelemetry.read(reg)' in main
          assert 'addAdcProofControls();' not in main
          assert 'addMotorIdBenchControls()' not in main
          assert 'sendEncrypted(MotorIdBenchProtocol.start()' not in main
          assert 'R6ReadOnlyTelemetry.supported(f.arg)' in main
          assert 'NinebotProtocol.READ,reg' in diag
          assert '0x0034' in diag and '0x4730' in diag
          assert "applicationId 'de.deltaesc.ebicsr6diag'" in grad
          print('PASS v0.3.9 r6 READ ONLY / crypto unchanged / no motor launch')
          PY
      - name: Test EBiCS r6 read-only request and decoder
        run: |
          mkdir -p /tmp/r6test
          javac -d /tmp/r6test \
            /tmp/app/v031/app/src/main/java/de/deltaesc/tool/NinebotProtocol.java \
            /tmp/app/v031/app/src/main/java/de/deltaesc/tool/R6ReadOnlyTelemetry.java \
            android/v0.3.9/TestR6ReadOnlyTelemetry.java
          java -cp /tmp/r6test de.deltaesc.tool.TestR6ReadOnlyTelemetry
      - name: ADC FA/FB request and response host vectors
        run: |
          mkdir -p /tmp/testclasses
          javac -d /tmp/testclasses \
            /tmp/app/v031/app/src/main/java/de/deltaesc/tool/NinebotProtocol.java \
            /tmp/app/v031/app/src/main/java/de/deltaesc/tool/AdcProofTelemetry.java \
            android/v0.3.8/TestAdcProofTelemetry.java
          java -cp /tmp/testclasses de.deltaesc.tool.TestAdcProofTelemetry
      - name: Regression frozen real G30 NinebotCrypto and fragmentation
        run: |
          mkdir -p /tmp/cryptoclasses
          javac -d /tmp/cryptoclasses \
            /tmp/app/v031/app/src/main/java/de/deltaesc/tool/Hex.java \
            /tmp/app/v031/app/src/main/java/de/deltaesc/tool/NinebotProtocol.java \
            /tmp/app/v031/app/src/main/java/de/deltaesc/tool/NinebotCrypto.java \
            /tmp/app/v031/tools/TestCrypto.java \
            /tmp/app/v031/tools/TestRealG30Vector.java \
            /tmp/app/v031/tools/TestRealG30Handshake.java \
            /tmp/app/v031/tools/TestRealG30FullHandshake.java \
            /tmp/app/v031/tools/TestRealG30Fragmentation.java
          for t in TestCrypto TestRealG30Vector TestRealG30Handshake TestRealG30FullHandshake TestRealG30Fragmentation; do
            java -cp /tmp/cryptoclasses de.deltaesc.tool.$t
          done
      - name: Build EBiCS r6 read-only debug APK
        working-directory: /tmp/app/v031
        run: gradle :app:assembleDebug --stacktrace
      - name: Package APK, reproducible source, SHA256
        run: |
          cp /tmp/app/v031/app/build/outputs/apk/debug/app-debug.apk /tmp/EBiCS_G30D_r6_ReadOnly_v0_3_9.apk
          tar --exclude=.gradle --exclude=app/build -C /tmp/app -cJf /tmp/EBiCS_G30D_r6_ReadOnly_v0_3_9_SOURCE.tar.xz v031
          sha256sum /tmp/EBiCS_G30D_r6_ReadOnly_v0_3_9.apk /tmp/EBiCS_G30D_r6_ReadOnly_v0_3_9_SOURCE.tar.xz | tee /tmp/SHA256SUMS_r6_v039.txt
      - uses: actions/upload-artifact@v4
        with:
          name: EBiCS-G30D-r6-READ-ONLY-APK-v039
          retention-days: 30
          if-no-files-found: error
          path: |
            /tmp/EBiCS_G30D_r6_ReadOnly_v0_3_9.apk
            /tmp/EBiCS_G30D_r6_ReadOnly_v0_3_9_SOURCE.tar.xz
            /tmp/SHA256SUMS_r6_v039.txt
