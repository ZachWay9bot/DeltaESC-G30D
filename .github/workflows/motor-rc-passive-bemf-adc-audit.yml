name: G30D passive BEMF ADC pin mapping (SWD read-only)
on:
  push:
    branches:
      - dev/motor-rc-v0914-gate-hardening
    paths:
      - "motor-rc/**"
      - ".github/workflows/motor-rc-passive-bemf-adc-audit.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  passive-bemf-frontend-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python STM32 ADC rank decode regression
        run: |
          set -euo pipefail
          python3 motor-rc/tools/test_parse_swd_adc.py
      - name: Verify no implicit BEMF hardware proof
        run: |
          set -euo pipefail
          grep -Fq 'NO passive-rotor-angle or sensorless lock assertion is allowed.' motor-rc/tools/parse_swd_adc.py
          grep -Fq 'mode=HOTPLUG freq=1000 -r32' motor-rc/tools/G30D_Passive_BEMF_ADC_Audit.ps1
          if grep -Ein -- '(-w32|-w8|-w16|--download|--erase|--reset|\bwrite\s+memory\b)' motor-rc/tools/G30D_Passive_BEMF_ADC_Audit.ps1 | grep -v -E '^[0-9]+:.*#'; then
            echo 'Forbidden write/reset action in READ-ONLY capture script' >&2
            exit 1
          fi
          echo 'PASS: data-only SWD register capture script, no motor commands, no BEMF fake lock'
